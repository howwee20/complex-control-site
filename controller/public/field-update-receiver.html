<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1117" />
    <title>Install Complex Control Update</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #090909; color: #f8f5f6; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; }
      main { width: min(620px, 100%); padding: 30px; border: 1px solid #56333a; border-left: 5px solid #d82032; border-radius: 18px; background: #111011; box-shadow: 0 24px 80px #0009; }
      .status { color: #fff; font-weight: 700; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <div class="status" id="status">Waiting for the prepared update from mycomplexcontrol.com…</div>
    </main>
    <script>
      (() => {
        "use strict";
        const SOURCE_ORIGIN = "https://mycomplexcontrol.com";
        const status = document.querySelector("#status");
        let prepared = null;
        let installStarted = false;

        const setStatus = (message) => { status.textContent = message; };
        const signatureHeader = (buffer) => {
          const bytes = new Uint8Array(buffer);
          let binary = "";
          for (let offset = 0; offset < bytes.length; offset += 0x8000) {
            binary += String.fromCharCode(...bytes.subarray(offset, offset + 0x8000));
          }
          return btoa(binary);
        };

        const installLatest = async () => {
          // This route accepts only a release signed by the controller owner's key.
          // Normal race controls remain protected by the operator PIN.
          if (prepared) {
            try {
              const response = await fetch("/api/system/frontend-update", { cache: "no-store" });
              const current = response.ok ? await response.json() : null;
              if (current?.current?.version === prepared.version) {
                setStatus(`Last update: ${prepared.version} · Successful`);
                window.opener?.postMessage({ type: "complex-control-field-update-complete", version: prepared.version }, SOURCE_ORIGIN);
              } else {
                setStatus(`Jake’s ${prepared.version} interface is verified and will install automatically.`);
                void installPrepared();
              }
            } catch {
              setStatus(`Jake’s ${prepared.version} interface is verified and will install automatically.`);
              void installPrepared();
            }
          }
        };

        const installPrepared = async () => {
          if (!prepared || installStarted) return;
          installStarted = true;
          setStatus(`Installing ${prepared.version}…`);
          const response = await fetch("/api/system/frontend-update", {
            method: "POST",
            headers: {
              "Content-Type": "application/gzip",
              "X-Frontend-Filename": prepared.filename,
              "X-Frontend-Signature": signatureHeader(prepared.signature),
              "X-Frontend-SHA256": prepared.sha256,
              "X-Frontend-Version": prepared.version,
            },
            body: prepared.capsule,
          });
          if (!response.ok) {
            const body = await response.json().catch(() => ({}));
            setStatus(body.detail || `The Pi rejected the update (${response.status}).`);
            installStarted = false;
            return;
          }
          setStatus("Verified. The Pi is installing and health-checking the new interface…");
          const deadline = Date.now() + 120000;
          while (Date.now() < deadline) {
            await new Promise((resolve) => setTimeout(resolve, 1800));
            try {
              const check = await fetch("/api/system/frontend-update", { cache: "no-store" });
              if (!check.ok) continue;
              const update = await check.json();
              if (update.state === "failed") {
                setStatus(update.message || "The update failed and the previous interface was restored.");
                installStarted = false;
                return;
              }
              if (update.state === "complete" && update.current?.version === prepared.version) {
                setStatus("Installed and healthy. Opening Jake’s newest controller…");
                window.opener?.postMessage({ type: "complex-control-field-update-complete", version: prepared.version }, SOURCE_ORIGIN);
                window.setTimeout(() => window.location.replace("/"), 900);
                return;
              }
            } catch {
              // A short disconnect is expected while the Pi restarts the web service.
            }
          }
          setStatus("The Pi is taking longer than expected. Open the controller to check its status.");
          installStarted = false;
        };

        window.addEventListener("message", (event) => {
          if (event.origin !== SOURCE_ORIGIN || event.source !== window.opener) return;
          if (event.data?.type !== "complex-control-field-capsule") return;
          if (!(event.data.capsule instanceof ArrayBuffer) || !(event.data.signature instanceof ArrayBuffer)) return;
          prepared = event.data;
          setStatus(`Received ${prepared.version}.`);
          void installLatest();
        });

        if (window.opener) {
          window.opener.postMessage({ type: "complex-control-field-receiver-ready" }, SOURCE_ORIGIN);
        } else {
          setStatus("Open this page from mycomplexcontrol.com after preparing the latest update.");
        }
      })();
    </script>
  </body>
</html>
