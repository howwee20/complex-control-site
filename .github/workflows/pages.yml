name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: controller/package-lock.json
      - name: Verify and build the field controller
        run: |
          npm ci --prefix controller
          npm run test --prefix controller
          npm run typecheck --prefix controller
          npm run build --prefix controller
          cp -R controller/dist "$RUNNER_TEMP/field-controller-dist"
      - name: Build signed phone-carried controller capsule
        env:
          FIELD_CAPSULE_SIGNING_KEY_B64: ${{ secrets.FIELD_CAPSULE_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$FIELD_CAPSULE_SIGNING_KEY_B64"
          printf '%s' "$FIELD_CAPSULE_SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/frontend-signing.pem"
          chmod 600 "$RUNNER_TEMP/frontend-signing.pem"
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='controller/' \
            --exclude='scripts/' \
            --exclude='README.md' \
            ./ _site/
          python3 - <<'PY'
          from pathlib import Path

          index = Path("_site/index.html")
          page = index.read_text(encoding="utf-8-sig")
          loader = '<script src="/field-controller-link.js"></script>'
          if loader not in page:
              page = page.replace("</body>", f"    {loader}\n  </body>")
          index.write_text(page, encoding="utf-8")
          PY
          python3 scripts/package-field-capsule.py \
            --dist "$RUNNER_TEMP/field-controller-dist" \
            --output _site/field \
            --commit "$GITHUB_SHA" \
            --created-at "$(git show -s --format=%cI "$GITHUB_SHA")" \
            --source-epoch "$(git show -s --format=%ct "$GITHUB_SHA")" \
            --signing-key "$RUNNER_TEMP/frontend-signing.pem"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
