    <script>
      // Local-only fields for reviewing separate LCQ and main-event lap counts.
      (() => {
        const addLapFields = () => {
          const fields = document.querySelector('.setup-section .event-fields');
          if (!fields || fields.dataset.lapCountsAdded) return;
          fields.dataset.lapCountsAdded = 'true';
          const raceType = document.createElement('div');
          raceType.className = 'local-race-type';
          const raceTypeLabel = document.createElement('label');
          const raceTypeText = document.createElement('span');
          const raceTypeSelect = document.createElement('select');
          raceTypeText.textContent = 'Race type';
          [
            ['elimination', 'Elimination racing'],
            ['practice', 'Practice'],
            ['time-attack', 'Time attack'],
          ].forEach(([value, text]) => {
            const option = document.createElement('option');
            option.value = value;
            option.textContent = text;
            raceTypeSelect.append(option);
          });
          raceTypeSelect.value = localStorage.getItem('complex-control-race-type') || 'elimination';
          raceTypeSelect.addEventListener('change', () => localStorage.setItem('complex-control-race-type', raceTypeSelect.value));
          raceTypeLabel.append(raceTypeText, raceTypeSelect);
          raceType.append(raceTypeLabel);
          fields.before(raceType);
          [
            ['Number of laps for LCQ', 'complex-control-lcq-laps'],
            ['Number of laps for main event', 'complex-control-main-laps'],
          ].forEach(([label, storageKey]) => {
            const field = document.createElement('label');
            const text = document.createElement('span');
            const input = document.createElement('input');
            text.textContent = label;
            input.type = 'number';
            input.min = '1';
            input.max = '10000';
            input.value = localStorage.getItem(storageKey) || '5';
            input.addEventListener('input', () => localStorage.setItem(storageKey, input.value));
            field.append(text, input);
            fields.append(field);
          });
        };
        new MutationObserver(addLapFields).observe(document.body, { childList: true, subtree: true });
        addLapFields();
      })();
    </script>

    <script>
      // Local-only racer profile storage and race setup selection.
      (() => {
        const key='complex-control-racer-profiles';
        const read=()=>{try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return[]}};
        const write=x=>localStorage.setItem(key,JSON.stringify(x));
        const refreshList=()=>{const list=document.querySelector('#profile-list');if(!list)return;const riders=read();list.innerHTML=riders.length?'':'No racer profiles added yet.';riders.forEach((r,i)=>{const p=document.createElement('p');p.innerHTML=`<strong>${r.name}</strong> Â· #${r.number} Â· ${r.tag||'No tag'} `;const b=document.createElement('button');b.type='button';b.textContent='Delete';b.dataset.deleteProfile=i;p.append(b);list.append(p)})};
        document.addEventListener('click',e=>{if(e.target.closest('#add-profile')){const n=document.querySelector('#profile-name'),num=document.querySelector('#profile-number'),tag=document.querySelector('#profile-tag');const riders=read();riders.push({name:n?.value||'Unnamed racer',number:num?.value||'â€”',tag:tag?.value||''});write(riders);window.setTimeout(refreshList,0)}if(e.target.dataset.deleteProfile!==undefined){const riders=read();riders.splice(Number(e.target.dataset.deleteProfile),1);write(riders);refreshList()}} ,true);

    <script>

      (() => {
        const q=(s,r=document)=>r.querySelector(s);
        const setupBuilder=()=>document.querySelectorAll('.local-race-card').forEach(card=>{if(card.dataset.raceBuilder)return;card.dataset.raceBuilder='1';const name=document.createElement('input');name.className='local-race-name';name.placeholder='Race name';name.required=true;name.style.cssText='display:block;width:100%;margin:0 0 16px;color:#fff;background:#191416;border:1px solid #6d2830;padding:12px;border-radius:6px';card.insertBefore(name,card.children[1]);const button=document.createElement('button');button.type='button';button.textContent='Create race';button.style.cssText='margin-top:18px;color:#fff;background:#c11e2d;border:0;border-radius:6px;padding:11px 18px;font-weight:700';card.append(button);button.onclick=()=>{const riders=[...document.querySelectorAll('.local-racer-checks input:checked')].map(x=>x.parentElement.textContent.trim());const all=[...document.querySelectorAll('.local-racer-checks label')].map(x=>x.textContent.trim());const selected=riders.length?riders:all;const per=Number([...card.querySelectorAll('input')].find(x=>/per heat/i.test(x.parentElement?.innerText||''))?.value||4);const heats=[];for(let i=0;i<selected.length;i+=per)heats.push(selected.slice(i,i+per));const title=name.value||'Untitled race';card.innerHTML=`<h2>${title}</h2><p class="local-race-help">${heats.length} heats planned Â· ${selected.length} racers</p>`;heats.forEach((h,i)=>{const wrap=document.createElement('div');wrap.style.cssText='border:1px solid #6d2830;border-radius:6px;padding:12px;margin:10px 0;color:#eee';wrap.innerHTML=`<strong>Heat ${i+1}</strong><p>${h.join(' Â· ')||'No racers selected'}</p>`;const start=document.createElement('button');start.type='button';start.textContent='Select and start heat';start.style.cssText='color:#fff;background:#c11e2d;border:0;border-radius:5px;padding:8px 12px';start.onclick=()=>showControl(title,`Heat ${i+1}`,h,card);wrap.append(start);card.append(wrap)});};});
        const showControl=(name,stage,riders,host)=>{host.innerHTML=`<h2>${name}</h2><p class="local-race-help">${stage} Â· ${riders.join(' Â· ')}</p><div class="local-race-actions"><button data-light="RED">RED</button><button data-light="YELLOW">YELLOW</button><button data-light="GREEN">GREEN</button></div><p class="local-race-help" id="light-state">RED â€” scanning disabled</p><h3 style="color:#ef3340">Results</h3><div id="local-results">No laps recorded.</div>`;let green=false;host.querySelectorAll('[data-light]').forEach(b=>b.onclick=()=>{green=b.dataset.light==='GREEN';q('#light-state',host).textContent=`${b.dataset.light} â€” ${green?'scanning enabled':'scanning disabled'}`});};

    <script>
      // Local-only temporary login gate and page-behavior corrections.

        const host=()=>{let h=q('.local-page-host');if(!h){h=document.createElement('main');h.className='local-page-host';q('.app-shell')?.append(h)}h.style.display='block';return h};
        const active=label=>qa('.topbar nav button').forEach(b=>b.classList.toggle('local-active',b.textContent.trim()===label));
        const showLogin=()=>{hideContent();active('Log In');const h=host();h.innerHTML='<h1>Connect to system</h1><div class="local-login-card"><label><span>Connect as</span><select id="gate-role"><option>Racer</option><option>Admin</option></select></label><label><span>PIN</span><input id="gate-pin" type="password" placeholder="Enter any PIN"></label><button id="gate-login" type="button">Log In</button><p class="local-race-help">Any non-empty PIN works during this local test.</p></div>';q('#gate-login').onclick=()=>{const pin=q('#gate-pin').value;if(!pin)return;localStorage.setItem(authKey,JSON.stringify({role:q('#gate-role').value}));syncAuth();showHome()}};
        const showHome=()=>{hideContent();const h=q('.local-page-host');if(h)h.style.display='none';const copy=q('.local-product-copy');if(copy)copy.style.display='block';active('Home')};
        const syncAuth=()=>{const s=session(),profiles=navButton('Racer Profiles'),racing=navButton("Let's Go Racing"),login=navButton('Log In')||navButton('Log Out');if(profiles)profiles.style.display=s?'':'none';if(racing)racing.style.display=s?'':'none';if(login)login.textContent=s?'Log Out':'Log In'};
        document.addEventListener('click',e=>{const b=e.target.closest('.topbar nav button');if(!b)return;const label=b.textContent.trim();if(label==='Log In'){e.preventDefault();e.stopImmediatePropagation();showLogin()}if(label==='Log Out'){e.preventDefault();e.stopImmediatePropagation();localStorage.removeItem(authKey);syncAuth();showHome()}if((label==='Racer Profiles'||label==="Let's Go Racing")&&!session()){e.preventDefault();e.stopImmediatePropagation();showLogin();return}if(label==='Racer Profiles')window.setTimeout(()=>{qa('.local-racing-page').forEach(x=>x.style.display='none');active('Racer Profiles')},0);if(label==="Let's Go Racing")window.setTimeout(()=>{const h=q('.local-page-host');if(h)h.style.display='none';active("Let's Go Racing")},0);if(label==='Home')window.setTimeout(showHome,0)},true);
        document.addEventListener('change',e=>{if(!e.target.matches('.local-racer-checks input[type=checkbox]'))return;const count=qa('.local-racer-checks input:checked').length;qa('.local-editor-fields label').forEach(l=>{if(/number of racers/i.test(l.innerText)){const i=q('input',l);if(i){i.value=Math.max(1,count);i.readOnly=true}}})});
