<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1117" />
    <link rel="manifest" href="/field-update.webmanifest" />
    <title>Update Complex Control</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #080808; color: #f8f5f6; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; }
      main { width: min(680px, 100%); padding: 32px; border: 1px solid #56333a; border-left: 5px solid #d82032; border-radius: 18px; background: #111011; box-shadow: 0 24px 80px #0009; }
      h1 { margin: 0 0 24px; font-size: clamp(1.9rem, 8vw, 3.2rem); }
      .status { margin: 14px 0 0; color: #fff; font-weight: 700; text-align: center; }
      button { width: 100%; min-height: 54px; border: 0; border-radius: 9px; padding: 0 18px; background: #d82032; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
      button:disabled { opacity: .45; cursor: wait; }
      nav { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
      a { color: #ff8993; }
      .note { margin: 18px 0 0; color: #bcb3b6; font-size: .9rem; line-height: 1.5; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <nav aria-label="Navigation"><a href="/">Home</a><a href="/?view=connect">Race Control</a></nav>
      <h1>Update Complex Control</h1>
      <button id="prepare" type="button">Update Pi</button>
      <div class="status" id="status">Ready.</div>
      <p class="note">Updates are saved on the Pi and install automatically when no race is running. Racing never waits for an update. Keep this page open until the Pi page appears.</p>
    </main>
    <script src="/field-update.js?updater=8" defer></script>
  </body>
</html>
